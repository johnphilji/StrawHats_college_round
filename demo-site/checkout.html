<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acme Store - Checkout</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="promo-banner" data-patchwork-id="promo-banner">Free shipping on orders over $50</div>
  
  <header class="site-header">
    <div class="site-logo" data-patchwork-id="site-logo">Acme Store</div>
    <nav class="site-nav">
      <a href="index.html" class="nav-link-home" data-patchwork-id="nav-link-home">Home</a>
      <a href="index.html#products" class="nav-link-shop" data-patchwork-id="nav-link-shop">Shop</a>
      <a href="index.html#about" class="nav-link-about" data-patchwork-id="nav-link-about">About</a>
      <a href="index.html#contact" class="nav-link-contact" data-patchwork-id="nav-link-contact">Contact</a>
    </nav>
    <div class="cart-indicator" data-patchwork-id="cart-indicator">Cart (1)</div>
  </header>

  <main class="main-content single-col">
    <section id="order-summary" class="order-summary">
      <h1>Order confirmed</h1>
      <p>Thank you for your purchase. We will email your receipt shortly.</p>
      <a href="index.html" class="continue-shopping-link" data-patchwork-id="continue-shopping-link">Continue shopping</a>
    </section>
  </main>

  <footer class="site-footer">
    <p class="footer-text" data-patchwork-id="footer-text">© 2026 Acme Store</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
